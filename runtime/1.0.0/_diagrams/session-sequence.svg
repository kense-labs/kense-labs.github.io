<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">会话时序</title>
<desc id="desc">界面、Main、Runtime、业务进程的会话与可选能力顺序。</desc>
<defs>
<marker id="rpc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3559db" stroke-width="1.5"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#087c72" stroke-width="1.5"/></marker>
<marker id="life" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#98510c" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="760" fill="#f7f5ef"/>
<g font-family="SFMono-Regular,Menlo,'PingFang SC','Microsoft YaHei',monospace">
<text x="48" y="40" font-size="14" fill="#596273">KENSE  /  KRun</text>
<text x="48" y="84" font-size="28" fill="#191c23" font-weight="600">会话时序</text>
<rect x="80" y="140" width="200" height="56" rx="8" fill="#fffdf8" stroke="#ccd0d7" stroke-width="1.5"/>
<text x="180" y="176" font-size="18" fill="#191c23" text-anchor="middle" font-weight="600">界面</text>
<rect x="360" y="140" width="200" height="56" rx="8" fill="#f0f3fb" stroke="#3559db" stroke-width="1.5"/>
<text x="460" y="176" font-size="18" fill="#3559db" text-anchor="middle" font-weight="600">Main</text>
<rect x="640" y="140" width="200" height="56" rx="8" fill="#eef2fc" stroke="#3559db" stroke-width="1.5"/>
<text x="740" y="176" font-size="18" fill="#3559db" text-anchor="middle" font-weight="600">Runtime</text>
<rect x="920" y="140" width="200" height="56" rx="8" fill="#edf6f2" stroke="#087c72" stroke-width="1.5"/>
<text x="1020" y="176" font-size="18" fill="#191c23" text-anchor="middle" font-weight="600">业务进程</text>
<line x1="180" y1="196" x2="180" y2="700" stroke="#ccd0d7" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="460" y1="196" x2="460" y2="700" stroke="#3559db" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="740" y1="196" x2="740" y2="700" stroke="#3559db" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="1020" y1="196" x2="1020" y2="700" stroke="#087c72" stroke-width="1.5" stroke-dasharray="6 6"/>
<path d="M180 240 H460" fill="none" stroke="#3559db" stroke-width="2.5" marker-end="url(#rpc)"/>
<text x="320" y="230" font-size="15" fill="#3559db" text-anchor="middle">操作</text>
<path d="M460 300 H740" fill="none" stroke="#3559db" stroke-width="2.5" marker-end="url(#rpc)"/>
<text x="600" y="290" font-size="15" fill="#3559db" text-anchor="middle">放置</text>
<path d="M460 360 H1020" fill="none" stroke="#3559db" stroke-width="2.5" marker-end="url(#rpc)"/>
<text x="740" y="350" font-size="15" fill="#3559db" text-anchor="middle">产品会话</text>
<path d="M1020 420 H460" fill="none" stroke="#087c72" stroke-width="2.5" marker-end="url(#data)"/>
<text x="740" y="410" font-size="15" fill="#087c72" text-anchor="middle">结果</text>
<path d="M460 480 H180" fill="none" stroke="#087c72" stroke-width="2.5" marker-end="url(#data)"/>
<text x="320" y="470" font-size="15" fill="#087c72" text-anchor="middle">状态</text>
<rect x="48" y="520" width="1104" height="180" rx="12" fill="#fffdf8" stroke="#ccd0d7" stroke-width="1.5"/>
<text x="72" y="556" font-size="16" fill="#98510c" font-weight="600">可选 · 宿主能力</text>
<path d="M1020 600 H460" fill="none" stroke="#98510c" stroke-width="2.5" marker-end="url(#life)"/>
<text x="740" y="590" font-size="15" fill="#98510c" text-anchor="middle">工具调用</text>
<path d="M460 650 H740" fill="none" stroke="#98510c" stroke-width="2.5" marker-end="url(#life)"/>
<text x="600" y="640" font-size="15" fill="#98510c" text-anchor="middle">中继</text>
<path d="M740 700 H1020" fill="none" stroke="#98510c" stroke-width="2.5" marker-end="url(#life)"/>
<text x="880" y="690" font-size="15" fill="#98510c" text-anchor="middle">回执</text>
</g>
</svg>
